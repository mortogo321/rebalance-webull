# =============================================================================
# Supabase gateway.
#
# supabase-js is built for one origin that serves both auth and data: it appends
# /auth/v1 and /rest/v1 to the URL it is given. The hosted platform puts Kong
# there. Kong's job in a local stack is almost entirely resolving the
# `sb_publishable_` / `sb_secret_` key format into a role, and self-hosted
# GoTrue and PostgREST do that themselves from a signed JWT -- so what is
# actually left is path routing, and that is this file.
#
# NOT infra/nginx/: that is the UAT blue/green edge proxy, which routes web and
# api between colour-suffixed upstreams and is reloaded by switch.sh. Sharing
# one config between a deploy mechanism and a local gateway would couple two
# things that change for entirely different reasons.
#
# No auth is enforced here. Every route below is protected by the JWT its
# upstream verifies, and by RLS underneath that.
# =============================================================================

upstream gotrue   { server gotrue:9999; keepalive 8; }
upstream postgrest { server postgrest:3000; keepalive 8; }

server {
  listen 8000 default_server;
  server_name _;

  client_max_body_size 1m;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";

  # --- auth (GoTrue) ---------------------------------------------------------
  # The trailing slash on proxy_pass strips /auth/v1, so /auth/v1/token reaches
  # GoTrue as /token, which is the path it actually serves.
  location /auth/v1/ {
    proxy_pass http://gotrue/;
  }

  # --- data (PostgREST) ------------------------------------------------------
  location /rest/v1/ {
    proxy_pass http://postgrest/;
  }

  # --- gateway liveness ------------------------------------------------------
  # Used by this service's own healthcheck, so `depends_on: service_healthy`
  # means "routing works", not merely "nginx started".
  location = /_gateway/health {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }
}
