# =============================================================================
# UAT edge proxy.
#
# This file is the near-zero-downtime mechanism. A release never restarts nginx;
# it rewrites conf.d/upstream.active.conf to point at the other colour and sends
# SIGHUP. nginx then starts new workers on the new config while the old workers
# finish the requests they are already serving, so in-flight requests complete
# rather than being reset.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $upstream_addr [$time_local] "$request" '
                  '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
  gzip_min_length 1024;

  # The active colour. Rewritten by infra/deploy/switch.sh, never by hand.
  include /etc/nginx/conf.d/upstream.active.conf;
  include /etc/nginx/conf.d/site.conf;
}
