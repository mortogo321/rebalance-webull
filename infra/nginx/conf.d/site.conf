# =============================================================================
# Site routing.
#
# Same origin for the app and the API. The browser therefore never issues a
# cross-origin preflight for an authenticated call, which removes both a round
# trip per request and an entire class of CORS misconfiguration.
# =============================================================================

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Which colour served this response. The single most useful header during a
  # deploy: it answers "did the switch actually take?" without shell access.
  add_header X-Served-By $upstream_addr always;

  # --- backend API (Deno + Hono) --------------------------------------------
  location /api/ {
    proxy_pass http://api_active;
    include /etc/nginx/conf.d/proxy-common.conf;
  }

  # --- web app (Next.js) -----------------------------------------------------
  location / {
    proxy_pass http://web_active;
    include /etc/nginx/conf.d/proxy-common.conf;
  }

  # --- deploy gate ----------------------------------------------------------
  # Unauthenticated and deliberately trivial: the deploy script polls this to
  # confirm the proxy itself is serving before it touches anything.
  location = /_edge/health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # The engine is NOT routed. Its /internal/* endpoints take a user_id as a
  # parameter and trust the caller to have authenticated already, so it must
  # only ever be reachable on the internal docker network.
}
